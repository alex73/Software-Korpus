</div>
<script>
    function showLog() {
        $("#log").show();
        $("#logShow").hide();
    }

    var activeTTSTask = null;

    function ttsTaskUrl(id) {
        return '/tts/tasks/' + encodeURIComponent(id);
    }

    function stopTTSTask(task, cancel) {
        if (task.stream) task.stream.close();
        if (task.heartbeat) clearInterval(task.heartbeat);
        task.stream = null;
        task.heartbeat = null;
        if (activeTTSTask === task) activeTTSTask = null;
        if (cancel && task.id) {
            fetch(ttsTaskUrl(task.id) + '/cancel', {method: 'POST', keepalive: true})
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                })
                .catch(error => console.error('Памылка адмены задачы:', error));
        }
    }

    function startTTSRequest(pipeline, text, onComplete) {
        if (activeTTSTask) stopTTSTask(activeTTSTask, true);
        const task = {id: null, stream: null, heartbeat: null};
        activeTTSTask = task;

        $('#status').text('');
        $('#spinner').show();
        $("#out").html('');

        fetch('/tts/tasks/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                text: text,
                pipeline: pipeline
            })
        })
        .then(r => {
            if (!r.ok) {
                throw new Error("HTTP " + r.status + " " + r.statusText);
            }
            return r.json();
        })
        .then(data => {
            if (!data.task_id || typeof data.task_id !== 'string') {
                throw new Error('Сервер не вярнуў ідэнтыфікатар задачы');
            }
            task.id = data.task_id;
            if (activeTTSTask !== task) {
                stopTTSTask(task, true);
                return;
            }

            const url = ttsTaskUrl(task.id);
            task.stream = new EventSource(url + '/stream');
            task.stream.onmessage = event => {
                if (activeTTSTask === task) $('#status').text('Статус: ' + event.data);
            };
            task.stream.onerror = () => {
                if (activeTTSTask === task) {
                    $('#status').text('Памылка злучэння з серверам; паўторнае падключэнне...');
                }
            };
            task.stream.addEventListener('done', event => {
                if (activeTTSTask !== task) return;
                let result;
                try {
                    result = JSON.parse(event.data);
                } catch (error) {
                    stopTTSTask(task, true);
                    $('#spinner').hide();
                    $('#status').text('Памылка адказу сервера: ' + error.message);
                    return;
                }
                stopTTSTask(task, false);
                $('#spinner').hide();
                if (result.status === 'завершана') {
                    $('#status').text('Статус: ' + result.status);
                    onComplete(task.id);
                } else {
                    $('#status').text('Статус: ' + result.status +
                        (result.error_message ? '. Памылка: ' + result.error_message : ''));
                }
            });
            task.heartbeat = setInterval(() => {
                fetch(url + '/ping', {method: 'POST'})
                    .then(response => {
                        // A terminal task may reject a ping before its done event arrives.
                        if (!response.ok && response.status !== 409) throw new Error('HTTP ' + response.status);
                    })
                    .catch(error => {
                        if (activeTTSTask === task) {
                            $('#status').text('Памылка heartbeat: ' + error.message);
                        }
                    });
            }, 5000);
        })
        .catch(err => {
            if (activeTTSTask !== task) return;
            stopTTSTask(task, true);
            $('#spinner').hide();
            $('#status').text('Памылка запуску: ' + err.message);
        });
    }

    window.addEventListener('pagehide', () => {
        if (activeTTSTask) stopTTSTask(activeTTSTask, true);
    });
</script>
